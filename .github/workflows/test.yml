name: Test

on:
  push:
    branches: [main, example/**]
  pull_request:
  workflow_dispatch:

# リポジトリの内容を読む権限だけを渡す。
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the container and install the packages
        run: make setup
      - name: Check the types
        run: make js/typecheck
      - name: Check the code
        run: make js/check
      - name: Run the tests
        run: make js/test
      - name: Build for production
        run: make js/build
      - name: Build Storybook
        run: make storybook/build
      - name: Start the development server
        run: make upd
      - name: Call the running server
        run: bash scripts/smoke.sh
      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs
